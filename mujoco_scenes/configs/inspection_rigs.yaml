schema_version: 1

camera_slots:
  inspection_left: left_shoulder_camera
  inspection_right: right_shoulder_camera
  inspection_top: overhead_camera
  inspection_front: side_camera
  inspection_close: front_camera

view_validation:
  minimum_valid_rig_cameras: 5
  minimum_object_camera_count: 2
  maximum_target_angle_degrees: 8.0
  minimum_valid_depth_pixels: 200

processing:
  external_association_max_distance_m: 0.12
  mask_erosion_pixels: 0
  depth_discontinuity_m: 0.060
  depth_discontinuity_radius_pixels: 1
  voxel_size_m: 0.003
  outlier_removal:
    enabled: true
    voxel_radius_m: 0.012
    minimum_neighbours: 2
    minimum_input_points: 40
  primary_component_filter:
    enabled: false
    minimum_component_fraction: 0.60

evidence_acceptance:
  minimum_object_points: 20
  minimum_inside_fraction: 0.55

# Positions and offsets are world-frame metres. Each camera is aimed at
# target_world_m + look_at_offset_m. Inspection volumes are selection gates
# only; they are never used to calculate object dimensions or properties.
regions:
  INITIAL:
    target_world_m: [0.0, -0.27, 0.70]
    # Preserve discriminative pixels on thin tabletop utensils while all five
    # views still cover the full initial inspection volume.
    rig_position_world_m: [0.0, -0.88, 1.02]
    up_world: [0.0, 0.0, 1.0]
    near_depth_m: 0.20
    far_depth_m: 2.20
    settle_steps: 50
    boundary_margin_m: 0.015
    inspection_volume:
      minimum_world_m: [-0.72, -0.43, 0.56]
      maximum_world_m: [0.42, -0.08, 0.92]
    cameras:
      inspection_left:
        position_offset_m: [-0.30, 0.00, 0.08]
        look_at_offset_m: [-0.12, 0.00, 0.00]
        fovy_degrees: 58.0
      inspection_right:
        position_offset_m: [0.30, 0.00, 0.08]
        look_at_offset_m: [0.12, 0.00, 0.00]
        fovy_degrees: 58.0
      inspection_top:
        position_offset_m: [0.00, 0.10, 0.38]
        look_at_offset_m: [0.00, 0.00, -0.03]
        fovy_degrees: 62.0
      inspection_front:
        # A second oblique view from the utensil side keeps fork tines
        # separated in RGB while the independent overhead slot preserves
        # rim/interior coverage for cavity geometry.
        position_offset_m: [0.32, 0.02, 0.10]
        look_at_offset_m: [0.12, 0.00, 0.00]
        fovy_degrees: 58.0
      inspection_close:
        position_offset_m: [0.30, 0.00, 0.08]
        look_at_offset_m: [0.12, 0.00, 0.00]
        fovy_degrees: 58.0

