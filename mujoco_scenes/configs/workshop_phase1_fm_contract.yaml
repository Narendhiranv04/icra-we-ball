schema_version: 2
description: "Manual surrogate contract for the fixed-object Workshop W2 benchmark."

task_instruction: "Find the compatible screw and first compatible driver encountered, insert the screw tip-down into the workbench hole, and drive it fully."

functional_requirements:
  - requirement_id: "req_obj_driver"
    entity_type: "OBJECT"
    function_name: "CAN_DRIVE_SCREW"
    description: "Tool capable of driving fasteners into the frame joint"
    rank: 1
    accepted_categories:
      - "screwdriver"
      - "power_driver"
    required_relations:
      - "REACHES_TARGET"
      - "COMPATIBLE_WITH"

  - requirement_id: "req_obj_fastener"
    entity_type: "OBJECT"
    function_name: "CAN_FASTEN"
    description: "Fastener component capable of securing the frame joint"
    rank: 2
    accepted_categories:
      - "screw"
    required_relations:
      - "COMPATIBLE_WITH_TARGET"

vocabulary:
  canonical_labels:
    screwdriver:
      detector_label: "screwdriver"
      detector_rank: 1
      aliases: ["hand screwdriver", "manual screwdriver"]
    power_driver:
      detector_label: "power drill"
      detector_rank: 2
      aliases: ["powered screwdriver", "cordless drill", "power driver", "drill driver"]
    screw:
      detector_label: "screw"
      detector_rank: 3
      aliases: ["fastener", "machine screw", "threaded screw"]
    hammer:
      detector_label: "wooden hammer"
      detector_rank: 4
      aliases: ["hammer", "mallet", "wood mallet"]
