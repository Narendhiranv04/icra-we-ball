schema_version: 1
task_id: l2_place_refreshment_tray_region_grounding
natural_language_goal: >-
  Place the refreshment tray on a suitable living-room surface within easy
  reach of the sofa.
specification_source: manual_future_fm_contract
generated_from_foundation_model: false

function:
  function_id: PLACE_REFRESHMENT_TRAY
  payload_role: refreshment_tray
  region_role: refreshment_serving_region
  required_region_count: 1

semantic_requirements:
  accepted_parent_categories:
    coffee_table: 1
    side_table: 2
    end_table: 2
    serving_table: 2
  rejected_parent_categories:
    - rug
    - carpet
    - floor
    - media_console
    - bookshelf
    - sofa
    - couch
  seating_categories: [sofa, couch]
  payload_categories: [serving_tray, tray]
  minimum_supporting_views: 2
  minimum_mean_confidence: 0.08
  # The fixed payload is not a search candidate. Role-scoped mask association
  # plus three-view agreement makes the lower-confidence synthetic tray label
  # sufficient for provenance without affecting destination selection.
  minimum_payload_mean_confidence: 0.03
  minimum_winning_score_margin: 0.05

geometric_requirements:
  unary_region:
    predicate: PLANAR_SUPPORT
    maximum_normal_angle_degrees: 12.0
    minimum_planarity_score: 0.92
    minimum_usable_area_m2: 0.06
  payload_region:
    relation: FITS_ON
    edge_clearance_margin_m: 0.020
    allowed_orientations_degrees: [0, 90]
  context:
    relation: NEAR_SEATING_AREA
    maximum_centroid_distance_m: 1.65

candidate_ranking:
  source: manual_future_fm_contract
  candidates:
    - inspection_label: RUG_PATCH
      rank: 1
    - inspection_label: SMALL_SIDE_TABLE
      rank: 2
    - inspection_label: COFFEE_TABLE
      rank: 3

production_mode: joint
