schema_version: 1
ontology_version: "runtime_functional_semantic_ontology_v1"

# Canonical runtime functional roles and accepted semantic categories by domain.
# Authoritative source of semantic category acceptance for online execution.

domains:
  kitchen:
    roles:
      coffee_container:
        accepted_categories:
          - cup
          - mug
      soup_container:
        accepted_categories:
          - bowl
      coffee_stirrer:
        accepted_categories:
          - spoon
      soup_eating_utensil:
        accepted_categories:
          - spoon
      coffee_source:
        # The runtime's own word for what may serve as the coffee supply.  A
        # canister and a caddy are the same kind of closed dry-goods vessel this
        # already accepts as a tin or a jar, and they are ordinary names for it,
        # so a detector that reports one is describing the supply rather than
        # something else.  Vessels that hold a *serving* -- a cup, a mug, a bowl
        # -- are deliberately absent.
        accepted_categories:
          - coffee_source
          - coffee_jar
          - coffee_container
          - coffee_tin
          - jar
          - coffee canister
          - coffee_canister
          - canister
          - coffee caddy
      water_source:
        accepted_categories:
          - kettle
          - water_source
          - water_container
          - teapot

  living_room:
    roles:
      PERSONAL_CUP_SAUCER_REGION:
        accepted_categories:
          - side_table
          - end_table
      SHARED_REMOTE_REGION:
        accepted_categories:
          - coffee_table
          - central_table
          - side_table
      CUP_SAUCER_SET:
        accepted_categories:
          - cup_saucer_set
          - cup
          - saucer
      REMOTE:
        accepted_categories:
          - remote_control
          - tv_remote
      SEATING_POSITION:
        accepted_categories:
          - armchair
          - chair
          - sofa
          - seating_position
      SEATING_PAIR:
        accepted_categories:
          - armchair
          - chair
          - sofa
          - seating_pair

  workshop:
    roles:
      driver:
        accepted_categories:
          - screwdriver
          - power_driver
          - power_drill
          - Phillips screwdriver
          - cordless power drill
      fastener:
        accepted_categories:
          - screw
          - Phillips screw
          - Phillips head screw
      repair_target:
        accepted_categories:
          - repair_target
          - workshop_frame_joint
          - recess

