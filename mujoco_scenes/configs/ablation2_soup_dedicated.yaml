schema_version: 2
task_id: provide_dedicated_spoons_for_two_soups
specification_source: manual_ablation2_v1

roles:
  soup_bowl:
    count: 2
    assignment_order: 0
    semantic_preferences:
      - rank: 1
        canonical_label: bowl
        detector_aliases: [soup bowl, mixing bowl]
    unary_geometry:
      - predicate: OPEN_CAVITY
        expected: true
  soup_spoon:
    count: 1
    assignment_order: 1
    semantic_preferences:
      - rank: 1
        canonical_label: spoon
        detector_aliases: [teaspoon, tablespoon]
    known_excluded_labels: [fork]
    unary_geometry:
      - predicate: ELONGATED_OBJECT
        expected: true

relations:
  - predicate: INSERTABLE_IN
    subject_role: soup_spoon
    object_role: soup_bowl
    expected: true
  - predicate: REACHES_BOTTOM
    subject_role: soup_spoon
    object_role: soup_bowl
    expected: true

operation_groups:
  soup_serving:
    function: SERVE_SOUP
    tool_role: soup_spoon
    target_role: soup_bowl
    required_target_count: 2
    usage_policy:
      mode: dedicated_per_target
      distinct_within_group: true
    relations: [INSERTABLE_IN, REACHES_BOTTOM]

cross_group_reuse:
  allowed: true
constraints:
  distinct_role_assignments: false
selection:
  policy: ranked_valid_candidate
