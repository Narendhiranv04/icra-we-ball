schema_version: 2
task_id: s1_integrated_prepare_and_serve_coffee_and_soup
specification_source: manual_s1_integrated_kitchen_v1
goal_instruction: "Prepare and serve coffee and soup for two people using the available kitchenware. Stir both coffees and provide each soup bowl with a suitable utensil. Search the closed kitchen storage for anything still required."
target_assignment_ablation: true

pairing:
  strategy: semantic_role_scoped

roles:
  coffee_container:
    count: 2
    assignment_order: 0
    semantic_preferences:
      - rank: 1
        canonical_label: cup
        detector_aliases: [coffee cup]
      - rank: 2
        canonical_label: mug
        detector_aliases: [coffee mug]
    unary_geometry:
      - predicate: OPEN_CAVITY
        expected: true

  soup_container:
    count: 2
    assignment_order: 1
    semantic_preferences:
      - rank: 1
        canonical_label: bowl
        detector_aliases: [soup bowl, mixing bowl]
    unary_geometry:
      - predicate: OPEN_CAVITY
        expected: true

  coffee_stirrer:
    binding_cardinality:
      mode: assignment_driven
      minimum_distinct_physical_objects: 1
      maximum_distinct_physical_objects: 2
      preferred: minimize_distinct
    assignment_order: 2
    semantic_preferences:
      - rank: 1
        canonical_label: spoon
        detector_aliases: [teaspoon, tablespoon, dessert spoon, soup spoon]
    known_excluded_labels: [fork, marker, pen, spatula, tongs]
    unary_geometry:
      - predicate: ELONGATED_OBJECT
        expected: true

  soup_eating_utensil:
    binding_cardinality:
      mode: assignment_driven
      minimum_distinct_physical_objects: 2
      maximum_distinct_physical_objects: 2
    assignment_order: 3
    semantic_preferences:
      - rank: 1
        canonical_label: spoon
        detector_aliases: [teaspoon, tablespoon, dessert spoon, soup spoon]
    known_excluded_labels: [fork, marker, pen, spatula, tongs]
    unary_geometry:
      - predicate: ELONGATED_OBJECT
        expected: true

relations:
  - predicate: INSERTABLE_IN
    subject_role: coffee_stirrer
    object_role: coffee_container
    expected: true
  - predicate: REACHES_BOTTOM
    subject_role: coffee_stirrer
    object_role: coffee_container
    expected: true
  - predicate: INSERTABLE_IN
    subject_role: soup_eating_utensil
    object_role: soup_container
    expected: true
  - predicate: REACHES_BOTTOM
    subject_role: soup_eating_utensil
    object_role: soup_container
    expected: true

operation_groups:
  coffee_stirring:
    function: STIR_COFFEE
    tool_role: coffee_stirrer
    target_role: coffee_container
    required_target_count: 2
    usage_policy:
      mode: sequential_reuse_allowed
      distinct_within_group: false
      same_tool_must_cover_all_targets: false
      selection_preference: minimize_distinct_tools
    relations: [INSERTABLE_IN, REACHES_BOTTOM]

  soup_serving:
    function: PROVIDE_SOUP_EATING_UTENSIL
    tool_role: soup_eating_utensil
    target_role: soup_container
    required_target_count: 2
    usage_policy:
      mode: dedicated_per_target
      distinct_within_group: true
    relations: [INSERTABLE_IN, REACHES_BOTTOM]

cross_group_reuse:
  allowed: false
  selection_preference: neutral
constraints:
  distinct_role_assignments: false
selection:
  policy: ranked_valid_candidate
  semantic_confidence_is_only_a_gate: true
diagnostics:
  max_representative_rejections: 300

# Declarative preparation specification. This is the sole ground-truth block
# intended to be replaced by a future FM. It describes required outcomes and
# causal dependencies, never physical object IDs or a linear action order.
symbolic_task:
  schema_version: 1
  home_region: countertop
  initial_observation_region: countertop
  contents: [coffee, water, soup]
  source_roles:
    coffee_source:
      accepted_semantic_labels: [coffee_source]
      provides: coffee
      count: 1
    water_source:
      accepted_semantic_labels: [kettle]
      provides: water
      count: 1
  target_requirements:
    coffee:
      witness_role: coffee_container
      required_contents: [coffee, water]
      requires_operation_group: coffee_stirring
      final_goal: served
    soup:
      witness_role: soup_container
      required_contents: [soup]
      initial_contents: [soup]
      requires_operation_group: soup_serving
      final_goal: served
  causal_dependencies:
    - [coffee_contents_present, coffee_stirred]
    - [coffee_stirred, coffee_served]
    - [soup_content_present, soup_utensil_placed]
    - [soup_utensil_placed, soup_served]
