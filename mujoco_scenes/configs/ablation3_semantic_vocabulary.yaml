schema_version: 1

# RGB-only vocabulary for Ablation 3. Persistent object association still
# uses visible masks, while simulator body/asset names never enter detection.
canonical_labels:
  bowl: [bowl, mixing bowl, soup bowl]
  cup: [cup, coffee cup]
  mug: [mug, coffee mug]
  spoon: [spoon, tablespoon, soup spoon]
  fork: [fork, dinner fork, table fork, metal fork, fork utensil]
