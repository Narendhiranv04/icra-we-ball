schema_version: 1

detector:
  backend: yolo_world
  # The 55 MB medium checkpoint remains CPU-capable but was materially more
  # reliable than the small checkpoint on thin synthetic utensils.
  checkpoint: yolov8m-worldv2.pt
  inference_size: 640
  device: cpu
  confidence_threshold: 0.03
  max_detections: 100

# Detector vocabulary is deliberately broader than the task's acceptable
# mixing-tool labels. This allows positive excluded-label evidence such as
# "marker" instead of treating every non-tool as an absent detection.
vocabulary:
  canonical_labels:
    bowl: [bowl, mixing bowl, soup bowl, serving bowl]
    cup: [cup, coffee cup]
    mug: [mug, coffee mug]
    spoon: [spoon, teaspoon, tablespoon, metal spoon, large spoon, ladle]
    fork: [fork, dinner fork, table fork, metal fork, red-handled fork, fork utensil]
    stirrer: [stirrer, drink stirrer, coffee stirrer, stirring stick]
    spatula: [spatula, turner]
    pen: [pen, writing pen]
    marker: [marker, permanent marker]
    knife: [knife, kitchen knife]
    jar: [jar, food jar]
    coffee_source: [coffee jar, coffee can, instant coffee tin, instant coffee jar, nescafe coffee jar]
    kettle: [kettle, tea kettle, teapot]
    bottle: [bottle]
    remote_control: [remote control, television remote, TV remote]
    book: [book, hardback book]
    coaster: [coaster, drink coaster]
    game_controller: [game controller, video game controller, gamepad]
    duster: [duster, hand duster, cleaning duster]

association:
  method: mask_box_overlap_v1
  minimum_visible_mask_pixels: 16
  minimum_box_mask_intersection_pixels: 8
  minimum_mask_fraction_inside_box: 0.20
  minimum_box_iou: 0.02
  minimum_association_score: 0.22
  ambiguity_margin: 0.04
  weights:
    mask_fraction_inside_box: 0.50
    box_mask_iou: 0.25
    box_fraction_on_mask: 0.15
    center_consistency: 0.10

mask_crop:
  enabled: true
  # A detection made from the object's own mask-bounded RGB crop is stronger
  # association evidence than an overlapping full-frame box. Labels still
  # come only from RGB; the multiplier prevents neighbouring utensil boxes
  # from winning the one-to-one match for a thin instance.
  association_preference_multiplier: 20.0
  padding_fraction: 0.30
  minimum_crop_size_pixels: 32
  # Remove neighbouring tabletop objects from the object-specific detector
  # crop. The visible instance mask is used only for association/cropping;
  # labels still come exclusively from the rendered RGB pixels retained
  # inside that mask.
  neutralize_background: true

fusion:
  # Fuse confidence with mask-association quality and visible-area support.
  # Rewarding genuine independent multi-view agreement.
  winner_policy: supporting_views_then_weighted_score
  minimum_supporting_views: 2
  minimum_mean_confidence: 0.03
  minimum_winning_label_margin: 0.08
  # A weighted-score winner must not erase a strong contradictory label seen
  # by multiple independent cameras when both the supporting view ratio and
  # score ratio indicate genuine multi-view conflict (e.g. 2-vs-3 disagreement).
  maximum_conflicting_view_fraction: 0.60
  maximum_conflicting_score_fraction: 0.40
  minimum_conflicting_mean_confidence: 0.10
  association_quality_power: 1.0
  visible_area_weight_power: 0.15
