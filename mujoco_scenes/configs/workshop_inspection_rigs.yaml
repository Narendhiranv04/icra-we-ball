    rig_position_world_m: [-0.28, -0.75, 0.88]
    up_world: [0.0, 0.0, 1.0]
    near_depth_m: 0.10
    far_depth_m: 1.25
    settle_steps: 80
    boundary_margin_m: 0.025
    inspection_volume: {minimum_world_m: [-0.55, -0.30, 0.35], maximum_world_m: [-0.05, 0.45, 0.65]}
    cameras: &drawer_views
      ISO_LEFT: {position_offset_m: [-0.36, 0.0, 0.12], look_at_offset_m: [-0.10, 0.0, 0.0], fovy_degrees: 62.0}
      ISO_RIGHT: {position_offset_m: [0.36, 0.0, 0.12], look_at_offset_m: [0.10, 0.0, 0.0], fovy_degrees: 62.0}
      DETAIL: {position_offset_m: [0.0, 0.20, 0.65], look_at_offset_m: [0.0, 0.0, -0.05], fovy_degrees: 64.0}
  RIGHT_DRAWER:
