    up_world: [0.0, 0.0, 1.0]
    near_depth_m: 0.10
    far_depth_m: 1.25
    settle_steps: 80
    boundary_margin_m: 0.025
    inspection_volume: {minimum_world_m: [0.05, -0.30, 0.35], maximum_world_m: [0.55, 0.45, 0.65]}
