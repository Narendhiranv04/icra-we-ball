schema_version: 2
inspection_sequence: [LEFT_DRAWER, RIGHT_DRAWER, TOOL_CABINET]
camera_slots:
  ISO_LEFT: workshop_camera_left
  ISO_RIGHT: workshop_camera_right
  DETAIL: workshop_camera_top
viewpoint_roles:
  ISO_LEFT: {azimuth_sign: LEFT, elevation: OBLIQUE}
  ISO_RIGHT: {azimuth_sign: RIGHT, elevation: OBLIQUE}
  DETAIL: {horizontal_region: TOP_DOWN, vertical_region: FRONT_HIGH, general_region: TOP_FRONT}
view_validation:
  minimum_valid_rig_cameras: 3
  minimum_object_camera_count: 2
  maximum_target_angle_degrees: 8.0
  minimum_valid_depth_pixels: 150
processing:
  mask_erosion_pixels: 0
  depth_discontinuity_m: 0.040
  depth_discontinuity_radius_pixels: 1
  voxel_size_m: 0.003
  outlier_removal: {enabled: true, voxel_radius_m: 0.012, minimum_neighbours: 2, minimum_input_points: 30}
  primary_component_filter: {enabled: false, minimum_component_fraction: 0.60}
evidence_acceptance: {minimum_object_points: 20, minimum_inside_fraction: 0.55}
regions:
  INITIAL:
    region_geometry: GENERAL
    target_world_m: [0.0, 0.35, 0.86]
    rig_position_world_m: [0.0, -1.05, 1.35]
    up_world: [0.0, 0.0, 1.0]
    near_depth_m: 0.15
    far_depth_m: 2.20
    settle_steps: 50
    boundary_margin_m: 0.025
    inspection_volume: {minimum_world_m: [-1.20, -0.15, 0.60], maximum_world_m: [1.20, 0.85, 1.50]}
    cameras:
      ISO_LEFT: {position_offset_m: [-0.36, 0.0, 0.12], look_at_offset_m: [-0.10, 0.0, 0.0], fovy_degrees: 70.0}
      ISO_RIGHT: {position_offset_m: [0.36, 0.0, 0.12], look_at_offset_m: [0.10, 0.0, 0.0], fovy_degrees: 70.0}
      DETAIL: {position_offset_m: [0.0, 0.20, 0.65], look_at_offset_m: [0.0, 0.0, -0.05], fovy_degrees: 72.0}
  LEFT_DRAWER:
