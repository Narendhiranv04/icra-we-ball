schema_version: 1
task_id: l2_integrated_living_room_region_function_phase1
requirement_entity_kind: REGION
natural_language_goal: "Prepare the living room for two people watching television. Place one refreshment set within easy reach of each person's seating position, and place the TV remote and game controller together on a suitable shared surface accessible to both people."
specification_source: manual_future_fm_contract
generated_from_foundation_model: false

payload_groups:
  refreshment_set_A:
    required_roles: [drink, snack_container]
    target_index: 0
  refreshment_set_B:
    required_roles: [drink, snack_container]
    target_index: 1
  shared_control_set:
    required_roles: [tv_remote, game_controller]

function_groups:
  personal_refreshment:
    function_id: PERSONAL_REFRESHMENT_REGION
    candidate_entity_kind: REGION
    region_role: personal_refreshment_region
    usage_policy: DEDICATED_REGION_PER_TARGET
    target_assignment_policy: TARGET_SPECIFIC
    target_role: seating_position
    required_target_count: 2
    payload_groups: [refreshment_set_A, refreshment_set_B]
    required_relations: [PLANAR_SUPPORT, FITS_SET_ON, NEAR_SEAT]
  shared_controls:
    function_id: SHARED_CONTROLS_REGION
    candidate_entity_kind: REGION
    region_role: shared_controls_region
    usage_policy: SHARED_REGION_REQUIRED
    target_role: both_seating_positions
    payload_groups: [shared_control_set]
    required_relations:
      [PLANAR_SUPPORT, FITS_SET_ON, ACCESSIBLE_FROM_BOTH_SEATS]

allow_cross_function_region_sharing: false

semantic_requirements:
  region_roles:
    personal_refreshment_region:
      accepted_categories:
        side_table: 1
        end_table: 1
        accent_table: 1
        small_serving_table: 1
      rejected_categories:
        coffee_table: 1
        rug: 1
        floor: 1
        media_console: 1
        bookshelf: 1
        chair: 1
        armchair: 1
        sofa: 1
        staging_table: 1
    shared_controls_region:
      accepted_categories:
        coffee_table: 1
        central_table: 1
        shared_side_table: 1
        side_table: 2
      rejected_categories:
        end_table: 1
        accent_table: 1
        small_serving_table: 1
        rug: 1
        floor: 1
        media_console: 1
        bookshelf: 1
        chair: 1
        armchair: 1
        sofa: 1
        staging_table: 1
  payload_roles:
    drink: [mug, cup]
    snack_container: [bowl, ramekin]
    tv_remote: [remote_control]
    game_controller: [game_controller, controller]
  seating_categories: [armchair, chair, sofa]
  minimum_supporting_views: 2
  minimum_mean_confidence: 0.03
  minimum_winning_score_margin: 0.015

geometric_requirements:
  unary_region:
    predicate: PLANAR_SUPPORT
    maximum_normal_angle_degrees: 12.0
    minimum_planarity_score: 0.90
    minimum_usable_area_m2: 0.030
  payload_region:
    relation: FITS_ON
    edge_clearance_margin_m: 0.015
    allowed_orientations_degrees: [0, 90]
  payload_set_region:
    relation: FITS_SET_ON
    edge_clearance_margin_m: 0.020
    inter_payload_clearance_m: 0.025
    allowed_orientations_degrees: [0, 90]
    arrangements: [ALONG_LENGTH, ALONG_WIDTH]
  personal_context:
    relation: NEAR_SEAT
    maximum_centroid_distance_m: 1.15
  control_context:
    relation: ACCESSIBLE_FROM_BOTH_SEATS
    maximum_distance_to_each_seat_m: 1.65

allocation:
  production_policy: global_target_specific
  diagnostic_modes:
    [semantic_only, geometry_only, joint, target_agnostic_count,
     greedy_target_specific, global_target_specific]
  deterministic_tie_break:
    - complete_target_coverage
    - total_signed_margin_descending
    - total_candidate_rank
    - persistent_region_ids
