schema_version: 2
goal_instruction: "Prepare and serve coffee and soup for two people using the available kitchenware. Stir both coffees and provide each soup bowl with a suitable utensil. Search the closed kitchen storage for anything still required."
inspection_order: [D1, D2, C2, B1, C1]
task_requirements: s1_integrated_kitchen_object_function.yaml
required_counts: {coffee_containers: 2, soup_containers: 2, soup_utensils: 2}
required_sources:
  water_source: [s1i_compact_kettle]
  coffee_source: [s1i_compact_coffee_jar]
role_object_kinds:
  coffee_stirrer: [s1i_final_long_narrow_spoon]
  soup_eating_utensil: [s1i_oversized_spoon, ab3_partial_spoon]

