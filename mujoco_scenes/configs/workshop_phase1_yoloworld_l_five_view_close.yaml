# Separate Workshop YOLO-World L five-view close-range profile.
schema_version: 1
pipeline:
  mask_backend: production
  semantic_backend: production
  fm_contract_path: mujoco_scenes/configs/workshop_phase1_fm_contract.yaml
  geometry_config_path: mujoco_scenes/configs/workshop_geometry_inference_yoloworld_l.yaml
  inspection_rig_config_path: mujoco_scenes/configs/workshop_inspection_rigs_yoloworld_l_five_view_close.yaml
  visual_profile_path: mujoco_scenes/configs/workshop_visual_profile_yoloworld_l.yaml
  requirements_source: static
  inspection_policy: fixed
  ablation: none
  image_width: 1280
  image_height: 720
perception:
  max_detector_vocabulary_size: 32
  detector:
    checkpoint: yolov8l-worldv2.pt
    confidence_threshold: 0.01
    proposal_crop_confidence_threshold: 0.001
    supplemental_prompts: ["Phillips screwdriver", "cordless power drill", "Phillips head screw", "Phillips screw", "screw", "wooden hammer"]
    supplemental_confidence_threshold: 0.001
    nms_iou_threshold: 0.35
    inference_size: 1280
    device: 0
    max_detections: 100
  volume_margin_m: 0.08
  min_points_per_mask: 6
  multi_scale:
    full_frame: true
    stage_crop: true
    stage_tiles: false
    tile_overlap_fraction: 0.15
  duplicate_suppression:
    box_iou_threshold: 0.72
    mask_overlap_threshold: 0.78
    centroid_distance_m: 0.012
    aabb_overlap_threshold: 0.55
  association:
    proposal_crop_association_multiplier: 20.0
tracking:
  cluster_distance_threshold_m: 0.050
  track_match_distance_threshold_m: 0.055
  voxel_size_m: 0.003
  min_cluster_points: 8
  stage_object_merge_distance_threshold_m: 0.015
semantic_fusion:
  winner_policy: weighted_score_then_supporting_views
  minimum_supporting_views: 1
  minimum_mean_confidence: 0.001
  minimum_winning_label_margin: 0.0005
  maximum_conflicting_view_fraction: 0.60
  maximum_conflicting_score_fraction: 0.60
  minimum_conflicting_mean_confidence: 0.001
  proposal_crop_score_multiplier: 20.0
inspection:
  sequence: [LEFT_DRAWER, RIGHT_DRAWER, TOOL_CABINET]
  early_stop: true
semantic_physical_prior:
  enabled: true
  small_object_max_dimension_m: 0.08
  small_object:
    screw: 2.0
    screwdriver: 0.0
    power_driver: 0.0
    hammer: 0.0
  large_object:
    screw: 0.0
    screwdriver: 2.0
artifacts:
  save_all_detection_overlays: true
  save_all_bbox_predictions: true
  save_raw_rgb: true
